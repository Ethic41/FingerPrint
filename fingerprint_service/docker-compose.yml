services:
  fingerprint_engine:
    image: ${FINGERPRINT_ENGINE_IMAGE:-fingerprint-engine:local}
    build:
      context: thirdparty/grpc-fingerprint-engine
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "127.0.0.1:${FINGERPRINT_ENGINE_PORT:-4134}:4134"
    restart: unless-stopped
    container_name: fingerprint_engine
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/4134'"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fingerprint_engine_net
  
  fingerprint_client:
    image: ${FINGERPRINT_CLIENT_IMAGE:-fingerprint-client:local}
    build: .
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "127.0.0.1:${FINGERPRINT_CLIENT_PORT:-5555}:80"
    restart: unless-stopped
    container_name: r3y3s_fingerprint_client
    depends_on:
      fingerprint_engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health.php') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fingerprint_engine_net
      - fingerprint_client_net

networks:
  fingerprint_engine_net:
  fingerprint_client_net:

